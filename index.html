const ICONS = {};
if (window.lucide && lucide.icons) Object.keys(lucide.icons).forEach(k=>{ const v=lucide.icons[k]; ICONS[kebab(k)] = v.iconNode || v; });
const I = ({n,s=16,c='',sw=2,st}) => {
  let node = ICONS[n];
  if(node && !Array.isArray(node) && node.iconNode) node = node.iconNode;
  if(!Array.isArray(node)) return <span style={{width:s,height:s,display:'inline-block'}}/>;
  const kids = node.map((el,i)=>React.createElement(el[0],{key:i,...el[1]}));
  return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={c} style={st}>{kids}</svg>;
};

const Counter = ({to, dur=1500, suffix='', decimals=0}) => {
  const [v,setV] = useState(0);
  useEffect(()=>{ let raf; const t0 = performance.now();
    const step = t => { const p = Math.min(1,(t-t0)/dur); const e = 1-Math.pow(1-p,3);
      setV(decimals? +(to*e).toFixed(decimals) : Math.round(to*e));
      if(p<1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf); },[to]);
  return <span>{decimals? v.toFixed(decimals) : v.toLocaleString()}{suffix}</span>;
};

const LineChart = ({data, color='#3b82f6', h=130}) => {
  const max = Math.max(...data)*1.15, w=560, p=10;
  const pts = data.map((v,i)=>[p+i*(w-2*p)/(data.length-1), h-12-(v/max)*(h-34)]);
  const path = pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ');
  return (<svg viewBox={`0 0 ${w} ${h}`} className="w-full">
    <path d={path+` L${w-p},${h-12} L${p},${h-12} Z`} fill={color} opacity=".07"/>
    <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round"/>
    {pts.map((pt,i)=><circle key={i} cx={pt[0]} cy={pt[1]} r="3" fill="#fff" stroke={color} strokeWidth="2"/>)}
  </svg>);
};

/* ============================== MAP ============================== */
const markerColor = c => c.status==='resolved' ? '#10b981' : SEV[c.severity].c;

const MapView = ({cases, vols, orgs, filter, onSelect, selected, heat, showVol=true, showOrg=true, height=560}) => {
  const [expanded, setExpanded] = useState({});
  const [hoverId, setHoverId] = useState(null);
  const visible = cases.filter(c=>{
    if(filter && filter.cat!=='All' && c.category!==filter.cat) return false;
    if(filter && filter.sev && c.severity!==filter.sev) return false;
    if(filter && filter.q){ const q=filter.q.toLowerCase();
      if(!(c.title.toLowerCase().includes(q)||c.category.toLowerCase().includes(q)||c.loc.toLowerCase().includes(q)||c.id.toLowerCase().includes(q))) return false; }
    return true;
  });
  const buckets = {};
  visible.forEach(c=>{ const k=Math.floor(c.x/16)+'-'+Math.floor(c.y/16); (buckets[k]=buckets[k]||[]).push(c); });
  const cells = Object.values(buckets).map(list=>{
    const cx=list.reduce((a,c)=>a+c.x,0)/list.length, cy=list.reduce((a,c)=>a+c.y,0)/list.length;
    return {list,cx,cy};
  });
  const hoverCase = cases.find(c=>c.id===hoverId && c.id!==selected);
  const HEATS = {
    needs:[{x:48,y:70,r:26,c:'#ef4444',o:.5},{x:58,y:22,r:20,c:'#f59e0b',o:.45},{x:64,y:58,r:16,c:'#f59e0b',o:.4},{x:31,y:48,r:14,c:'#eab308',o:.35}],
    volunteers:[{x:38,y:34,r:24,c:'#3b82f6',o:.5},{x:64,y:58,r:20,c:'#3b82f6',o:.45},{x:44,y:16,r:14,c:'#3b82f6',o:.35},{x:22,y:62,r:10,c:'#3b82f6',o:.2}],
    resolved:[{x:63,y:64,r:18,c:'#10b981',o:.5},{x:47,y:88,r:16,c:'#10b981',o:.45},{x:30,y:38,r:14,c:'#10b981',o:.4},{x:66,y:50,r:12,c:'#10b981',o:.35}],
    response:[{x:74,y:56,r:20,c:'#10b981',o:.45},{x:16,y:52,r:18,c:'#f59e0b',o:.45},{x:46,y:56,r:16,c:'#ef4444',o:.4},{x:74,y:14,r:12,c:'#10b981',o:.35}],
    gaps:[{x:36,y:82,r:24,c:'#ef4444',o:.5},{x:74,y:20,r:18,c:'#f59e0b',o:.45},{x:27,y:26,r:12,c:'#eab308',o:.35}]
  };
  return (
  <div className="relative rounded-[24px] overflow-hidden border border-slate-200 shadow-inner mapgrid select-none"
    style={{height, background:'linear-gradient(135deg,#eef3fb 0%,#f4f0fd 50%,#eafaf2 100%)'}}>
    <svg className="absolute inset-0 w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path d="M0,28 C25,24 55,38 100,32" stroke="#c2cfe4" strokeWidth="1.8" fill="none"/>
      <path d="M0,62 C35,56 65,74 100,66" stroke="#c2cfe4" strokeWidth="1.5" fill="none"/>
      <path d="M18,0 C24,30 20,70 28,100" stroke="#ccd7ea" strokeWidth="1.3" fill="none"/>
      <path d="M52,0 C48,35 60,65 54,100" stroke="#ccd7ea" strokeWidth="1.3" fill="none"/>
      <path d="M80,0 C76,30 88,60 82,100" stroke="#d5deee" strokeWidth="1" fill="none"/>
      <path d="M0,84 C30,80 70,92 100,86" stroke="#d5deee" strokeWidth="1" fill="none"/>
      <path d="M0,10 C40,6 60,16 100,10" stroke="#d5deee" strokeWidth="1" fill="none"/>
    </svg>
    {ZONES.map(z=>(<span key={z.label} className="absolute text-[10px] font-bold tracking-widest text-slate-400/80" style={{left:z.x+'%',top:z.y+'%'}}>{z.label.toUpperCase()}</span>))}
    {heat && HEATS[heat] && HEATS[heat].map((h,i)=>(
      <span key={i} className="heat absolute rounded-full pointer-events-none" style={{
        left:`calc(${h.x}% - ${h.r*7}px)`, top:`calc(${h.y}% - ${h.r*7}px)`, width:h.r*14, height:h.r*14,
        background:`radial-gradient(circle, ${h.c}${Math.round(h.o*255).toString(16).padStart(2,'0')} 0%, transparent 70%)`}}/>))}
    {showOrg && !heat && orgs.map(o=>(
      <span key={'o'+o.id} className="marker absolute" style={{left:(o.id*11+8)%88+4+'%', top:(o.id*17+12)%80+8+'%'}} title={o.name+' · '+o.focus}>

        const crit = cell.list.some(c=>c.severity==='critical'&&c.status!=='resolved');
        return (<button key={ci} className="marker absolute z-20" style={{left:cell.cx+'%',top:cell.cy+'%'}} onClick={()=>setExpanded({...expanded,[ci]:true})}>
          {crit && <span className="pulse-dot absolute -inset-1.5 rounded-full"/>}

      }
      return cell.list.map((c,i)=>(
        <button key={c.id} className="marker absolute z-10" style={{left:c.x+'%',top:c.y+'%'}}
          onClick={()=>onSelect(c.id)} onMouseEnter={()=>setHoverId(c.id)} onMouseLeave={()=>setHoverId(null)} title="">
          {c.severity==='critical' && c.status!=='resolved' && <span className="pulse-dot absolute -inset-1 rounded-full"/>}
          {c.status!=='resolved' && c.severity!=='critical' && <span className="pulse-soft absolute -inset-1 rounded-full" style={{animationDelay:(i*0.5)+'s'}}/>}
          <span className={`w-7 h-7 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-white relative ${selected===c.id?'ring-4 ring-vol/40':''}`} style={{background:markerColor(c)}}>
            <I n={c.status==='resolved'?'check':(CAT_ICON[c.category]||'map-pin')} s={12}/>
          </span>
        </button>));
    })}
    {/* hover preview */}
    {hoverCase && (
      <div className="absolute z-30 pointer-events-none glass rounded-2xl px-3.5 py-2.5 shadow-xl fade-in"
        style={{left:Math.min(hoverCase.x,62)+'%', top:Math.max(hoverCase.y-14,2)+'%'}}>
        <div className="flex items-center gap-1.5 mb-0.5"><SevChip sev={hoverCase.severity}/><span className="text-[9px] font-bold text-slate-400">#{hoverCase.id}</span></div>
        <p className="text-[11px] font-bold leading-snug max-w-[180px]">{hoverCase.title}</p>
      </div>)}
    <div className="absolute bottom-3 right-3 glass rounded-2xl px-3.5 py-2.5 text-[10px] font-semibold text-slate-600 space-y-1 shadow-lg">
      {[['#ef4444','Critical'],['#f59e0b','Urgent'],['#eab308','Need'],['#3b82f6','Volunteer'],['#8b5cf6','NGO'],['#10b981','Resolved']].map(([c,l])=>(
        <div key={l} className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{background:c}}/>{l}</div>))}
    </div>
  </div>);
};

          {feed.map((f,i)=>(
            <div key={f.id||i} onClick={()=>f.caseId&&openCase(f.caseId)}
              className={`flex gap-2.5 items-start p-2.5 rounded-xl ${i===0?'fade-in bg-slate-50':'hover:bg-slate-50'} ${f.caseId?'cursor-pointer':''}`}>
              <span className="text-sm leading-none mt-0.5">{f.icon}</span>
              <p className="text-[12px] text-slate-600 leading-snug">{f.txt}</p>
            </div>))}
        </div>
        <div className="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-slate-100 text-center">
          {[['🔴',critical.length,'Critical'],['🟠',cases.filter(c=>c.severity==='urgent'&&c.status!=='resolved').length,'Urgent'],['🟢',cases.filter(c=>c.status==='resolved').length,'Resolved']].map(([e,v,l])=>(
            <div key={l} className="rounded-xl bg-slate-50 py-2"><p className="h1 text-base">{e} {v}</p><p className="text-[9px] font-bold text-slate-400 tracking-wider">{l.toUpperCase()}</p></div>))}
        </div>
      </div>
    </div>
  </div>);
};

/* ============================== REPORT FLOW + AI + MATCH ============================== */
const inferReport = (d, chosenCat) => {
  const s=(d||'').toLowerCase();
  if(/blood/.test(s)) return {cat:'Blood',sev:'critical',det:'Urgent blood requirement detected'};
  if(/accident|unconscious|heart|bleed|injur|ambulance|collapse/.test(s)) return {cat:'Medical',sev:'critical',det:'Medical emergency indicators'};
  if(/fire|smoke|gas|explosion/.test(s)) return {cat:'Disaster',sev:'critical',det:'Fire / hazard indicators'};
  if(/flood|water|drain|overflow|waterlog/.test(s)) return {cat:'Infrastructure',sev:'urgent',det:'Severe waterlogging — blocked drainage'};
  if(/tree|road|block|wire|pole/.test(s)) return {cat:'Safety',sev:'urgent',det:'Large road obstruction'};
  if(/dog|cat|animal|puppy|bird/.test(s)) return {cat:'Animal Welfare',sev:'urgent',det:'Animal in distress'};
  if(/elderly|old man|old woman|senior|grandpa|grandma/.test(s)) return {cat:'Elderly',sev:'urgent',det:'Elderly person needs assistance'};
  if(/food|hunger|meal|starving/.test(s)) return {cat:'Food',sev:'normal',det:'Food assistance requirement'};
  if(/shelter|homeless|blanket|cold/.test(s)) return {cat:'Shelter',sev:'urgent',det:'Shelter requirement'};
  if(/wheelchair|ramp|blind|deaf|disab/.test(s)) return {cat:'Accessibility',sev:'normal',det:'Accessibility barrier'};
  if(/garbage|waste|plastic|trash|pollution/.test(s)) return {cat:'Environment',sev:'urgent',det:'Sanitation / pollution hazard'};
  return {cat:chosenCat||'Other',sev:'normal',det:'Community assistance request'};
};

const AI_STEPS = [
  {t:'UNDERSTANDING REPORT', s:'Input analyzed', icon:'scan-text'},
  {t:'IDENTIFYING NEED', s:'Category detected', icon:'tag'},
  {t:'ASSESSING URGENCY', s:'Severity estimated', icon:'gauge'},
  {t:'CHECKING COMMUNITY SIGNALS', s:'Related reports analyzed', icon:'radio'},
  {t:'FINDING SUPPORT', s:'Nearby resources identified', icon:'radar'}
];

const ReportFlow = ({createCase, matchNotify, openCase, vols, orgs}) => {

      });

  const submit = () => {

  const matches = useMemo(()=>{
    if(!newCase) return {vm:[],om:[]};
    const skillMap = {Medical:['Medical','Nursing','First Aid'],Blood:['Medical','Nursing'],Elderly:['Elderly Care','Counseling'],'Animal Welfare':['Animal Rescue'],Infrastructure:['Construction','Electrical Repair'],Shelter:['Logistics & Riding','Counseling'],Food:['Food Distribution'],Education:['Teaching'],Environment:['Construction','Food Distribution'],Accessibility:['Sign Language','Elderly Care'],Safety:['Search & Rescue','First Aid'],Disaster:['Search & Rescue','First Aid']};

    const vm = vols.filter(v=>v.available).map(v=>{
      let score = 100 - v.dist*8;
      if(want.includes(v.skill)) score += 30;
      score += (v.reliability-90)*1.2;
      return {...v, score:Math.round(Math.min(99,score)), matchSkill: want.includes(v.skill)};
    }).sort((a,b)=>b.score-a.score).slice(0,3);
    const om = orgs.map(o=>({...o, score: 90 - o.dist*6 + (o.focus.toLowerCase().includes(newCase.category.toLowerCase().split(' ')[0])?25:0)})).sort((a,b)=>b.score-a.score).slice(0,2);
    return {vm, om};

            <span className="w-8 h-8 rounded-xl flex items-center justify-center text-white" style={{background:'linear-gradient(135deg,#a855f7,#6366f1)'}}><I n="brain" s={15}/></span>

              </div>))}
            {matches.om.map(o=>(

          </div>

};

/* ============================== CASE DETAIL / RESPONSE ROOM ============================== */
const CasePage = ({c, vols, orgs, acceptCase, markComplete, confirmResolution, matchNotify, back}) => {
  if(!c) return null;
  const canRespond = ['open','matching'].includes(c.status);
  const hasMedia = (c.files||[]).some(f=>f.type==='image'||f.type==='video');
  const active = ['in_progress','awaiting_confirmation'].includes(c.status);
  const tasks = [
    {l:'Report received & AI-verified', done:true},
    {l:'Responder team assembled', done:(c.responders||[]).length>0},
    {l:'Team en route to location', done:active || c.status==='resolved'},
    {l:'Action completed on ground', done:['awaiting_confirmation','resolved'].includes(c.status)},
    {l:'Resolution confirmed by community', done:c.status==='resolved'}
  ];
  const prog = tasks.filter(t=>t.done).length/tasks.length*100;
  return (
  <div className="fade-in space-y-5">
    <div className="flex items-center justify-between flex-wrap gap-2">
      <button className="btn-o px-4 py-2 text-xs flex items-center gap-2" onClick={back}><I n="arrow-left" s={14}/>Back</button>
      {active && <span className="chip bg-urg/10 text-urg flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-urg animate-pulse"/>RESPONSE ROOM LIVE · {(c.responders||[]).length} responder{(c.responders||[]).length!==1?'s':''} active</span>}
    </div>
    <div className="grid lg:grid-cols-3 gap-5">
      <div className="lg:col-span-2 space-y-5">
        {/* CASE */}
        <div className="card p-6">
          <p className="eyebrow mb-2">CASE · #{c.id}</p>
          <div className="flex items-center gap-2 flex-wrap mb-2"><SevChip sev={c.severity}/><StatusChip st={c.status}/><CatTag cat={c.category}/></div>
          <h1 className="h1 text-2xl leading-tight">{c.title}</h1>
          <p className="text-sm text-slate-600 mt-4 leading-relaxed">{c.desc}</p>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5">
            {[['map-pin',c.loc,'LOCATION'],['clock',c.time,'REPORTED'],['users',(c.responders||[]).length+' responding','TEAM'],['shield-check',c.trust+'% trust','TRUST SCORE']].map(([ic,v,l])=>(
              <div key={l} className="rounded-2xl bg-slate-50 p-3"><I n={ic} s={14} c="text-slate-400"/><p className="text-xs font-bold mt-1.5 leading-snug">{v}</p><p className="eyebrow mt-0.5">{l}</p></div>))}
          </div>
          {hasMedia && <div className="flex gap-2.5 mt-4 flex-wrap">
            {(c.files||[]).filter(f=>f.type!=='voice').map((f,i)=>(
              <div key={i} className="w-24 h-24 rounded-2xl flex flex-col items-center justify-center text-white shadow-md" style={{background:'linear-gradient(135deg,#334155,#0f1b2d)'}}>
                <I n={f.type==='video'?'video':'image'} s={22}/><span className="text-[9px] font-semibold mt-1.5 px-2 text-center truncate w-full">{f.name}</span></div>))}
            {(c.files||[]).filter(f=>f.type==='voice').map((f,i)=>(
              <div key={'v'+i} className="h-24 px-4 rounded-2xl flex items-center gap-2 bg-slate-100"><I n="mic" s={16} c="text-ai"/><div className="flex items-end gap-0.5 h-6">{[6,12,18,10,16,8,14,5].map((h,j)=><span key={j} className="w-1 rounded bg-ai/60" style={{height:h}}/>)}</div><span className="text-[10px] font-bold text-slate-500">{f.name}</span></div>))}
          </div>}
          {c.status==='resolved' && (
            <div className="mt-5 rounded-2xl p-4 flex items-center gap-3 border border-ok/25" style={{background:'linear-gradient(135deg,#ecfdf5,#f0fdfa)'}}>
              <I n="badge-check" s={22} c="text-ok"/><div><p className="text-sm font-bold text-ok">Resolved & verified</p><p className="text-[11px] text-slate-500">Confirmed by the reporter {c.resolvedAt?('· '+c.resolvedAt):''} — humans verified, AI recorded.</p></div>
            </div>)}
        </div>

        {/* TASKS */}
        <div className="card p-6">
          <SectionHead icon="list-checks" title="Response Tasks" sub="Progress updates live as the team acts" color="#3b82f6"/>
          <div className="h-2 bg-slate-100 rounded-full overflow-hidden mb-4"><div className="h-full rounded-full transition-all duration-700" style={{width:prog+'%',background:'linear-gradient(90deg,#3b82f6,#10b981)'}}/></div>
          <div className="space-y-2">
            {tasks.map((t,i)=>(
              <div key={i} className={`flex items-center gap-3 p-3 rounded-xl transition ${t.done?'bg-ok/5':'bg-slate-50'}`}>
                <span className={`w-6 h-6 rounded-full flex items-center justify-center shrink-0 ${t.done?'bg-ok text-white':'bg-white border-2 border-slate-200'}`}>{t.done && <I n="check" s={12}/>}</span>
                <p className={`text-xs font-semibold ${t.done?'text-ink':'text-slate-400'}`}>{t.l}</p>
              </div>))}
          </div>
        </div>

        {/* TIMELINE */}
        <div className="card p-6">
          <SectionHead icon="activity" title="Activity Timeline" sub="Every step is recorded and auditable" color="#0ea5e9"/>
          <div>
            {c.timeline.map((t,i)=>(
              <div key={i} className="flex gap-4">
                <div className="flex flex-col items-center">
                  <span className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${i===c.timeline.length-1?'text-white shadow-md':'bg-slate-100 text-slate-400'}`} style={i===c.timeline.length-1?{background:STATUS_META[c.status]?.c||'#0f1b2d'}:{}}><I n={t.icon} s={13}/></span>
                  {i<c.timeline.length-1 && <span className="w-0.5 flex-1 bg-slate-100 my-1"/>}
                </div>
                <div className="pb-5"><p className="text-[10px] font-bold text-slate-400">{t.t}</p><p className="text-xs font-semibold mt-0.5">{t.txt}</p></div>
              </div>))}
          </div>
        </div>
      </div>

      {/* right rail */}
      <div className="space-y-5">
        {/* TEAM */}
        <div className="card p-5">
          <SectionHead icon="users" title="Response Team" color="#10b981"/>
          {(c.responders||[]).length===0 && <p className="text-xs text-slate-400">No responders yet — CIVORA MATCH is finding the best people.</p>}
          <div className="space-y-2.5">
            {(c.responders||[]).map((r,i)=>(
              <div key={i} className="flex items-center gap-2.5 rise" style={{animationDelay:(i*0.15)+'s'}}>
                <Av name={r.n} color={['#3b82f6','#8b5cf6','#10b981','#f59e0b'][i%4]} s={32}/>
                <div className="flex-1"><p className="text-xs font-bold">{r.n}</p><p className="text-[10px] text-slate-400">{r.r}</p></div>
                {active && <span className="w-2 h-2 rounded-full bg-ok pulse-soft"/>}
              </div>))}
          </div>
          {c.org && <div className="mt-3 pt-3 border-t border-slate-100 flex items-center gap-2.5">
            <span className="w-8 h-8 rounded-xl flex items-center justify-center text-white" style={{background:'#8b5cf6'}}><I n="building" s={14}/></span>
            <div><p className="text-xs font-bold">{c.org}</p><p className="text-[10px] text-slate-400">Organization support</p></div>
          </div>}
        </div>

        {/* TRUST */}
        <div className="card p-5">
          <SectionHead icon="shield-check" title="Trust & Verification" color="#10b981"/>
          <div className="flex items-center gap-3"><Ring pct={c.trust} size={74} stroke={8} color={c.trust>=85?'#10b981':'#f59e0b'}><p className="h1 text-lg">{c.trust}%</p></Ring>
            <div><TrustChip ts={c.trustState}/><p className="text-[10px] text-slate-400 mt-1.5 leading-snug">Evidence · location · history · community confirmation</p></div></div>
        </div>

        {/* ACTIONS */}
        <div className="card p-5 space-y-2.5">
          {canRespond && <>
            <button className="btn-g w-full py-3 text-sm flex items-center justify-center gap-2" onClick={()=>acceptCase(c.id)}><I n="hand-helping" s={15}/>I CAN HELP — Accept Case</button>
            <button className="btn-ai w-full py-3 text-sm flex items-center justify-center gap-2" onClick={()=>matchNotify(c.id)}><I n="sparkles" s={15}/>Run CIVORA MATCH</button>
          </>}
          {c.status==='in_progress' && <>
            <button className="btn-p w-full py-3 text-sm flex items-center justify-center gap-2" onClick={()=>markComplete(c.id)}><I n="flag" s={15}/>MARK ACTION COMPLETE</button>
            <p className="text-[10px] text-slate-400 text-center">Marks your action done — resolution still needs human confirmation.</p>
          </>}
          {c.status==='awaiting_confirmation' && <>
            <button className="btn-g w-full py-3 text-sm flex items-center justify-center gap-2" onClick={()=>confirmResolution(c.id)}><I n="badge-check" s={15}/>CONFIRM RESOLUTION</button>
            <p className="text-[10px] text-slate-400 text-center flex items-center justify-center gap-1"><I n="shield-check" s={11}/>Human confirmation required — AI never auto-resolves.</p>
          </>}
          {c.status==='resolved' && <div className="rounded-2xl bg-ok/10 text-ok text-xs font-bold p-3 text-center">✓ Another problem solved by the community.</div>}
        </div>

        <div className="card p-5">
          <p className="eyebrow mb-2 flex items-center gap-1.5"><I n="lock" s={12}/>YOUR PRIVACY MATTERS</p>
          <p className="text-[11px] text-slate-500 leading-relaxed">Approximate location only. No phone numbers, exact addresses, or unnecessary medical details are ever exposed.</p>
        </div>
      </div>
    </div>
  </div>);
};

/* ============================== VOLUNTEER CENTER ============================== */
const VolunteerCenter = ({cases, vols, acceptCase, openCase, profile, go}) => {
  const [fDist,setFDist] = useState(5); const [fUrg,setFUrg] = useState('any'); const [fCat,setFCat] = useState('All');
  const opps = cases.filter(c=>['open','matching'].includes(c.status))
    .map(c=>({...c, d:+km(c)}))

    .sort((a,b)=> (a.severity==='critical'?0:a.severity==='urgent'?1:2)-(b.severity==='critical'?0:b.severity==='urgent'?1:2) || a.d-b.d);
  const myActive = cases.filter(c=>c.status==='in_progress' && (c.responders||[]).some(r=>r.n==='You'));

  <div className="fade-in space-y-6">
    <div className="flex flex-wrap items-end justify-between gap-4">
      <div><p className="eyebrow mb-1">VOLUNTEER CENTER</p>
        <h1 className="h1 text-3xl">Make an impact <span className="grad-text">nearby</span>.</h1>

      <span className="chip bg-ok/10 text-ok inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-ok animate-pulse"/>Available now</span>

      <div className="card p-5 border-l-4" style={{borderLeftColor:'#f59e0b'}}>
        <p className="eyebrow text-urg mb-2">YOUR ACTIVE RESPONSE{myActive.length>1?'S':''}</p>
        {myActive.map(c=>(
          <button key={c.id} className="w-full text-left flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50" onClick={()=>openCase(c.id)}>
            <span className="w-9 h-9 rounded-xl flex items-center justify-center text-white" style={{background:markerColor(c)}}><I n={CAT_ICON[c.category]||'map-pin'} s={15}/></span>
            <div className="flex-1"><p className="text-sm font-bold">{c.title}</p><p className="text-[11px] text-slate-400">#{c.id} · Response Room is live</p></div>
            <I n="chevron-right" s={15} c="text-slate-300"/>
          </button>))}
      </div>)}

    <div className="card p-4 flex flex-wrap items-center gap-4">
      <div className="flex items-center gap-2"><I n="locate-fixed" s={14} c="text-slate-400"/><span className="eyebrow">DISTANCE</span>
        <input type="range" min="1" max="5" step="0.5" value={fDist} onChange={e=>setFDist(+e.target.value)} className="accent-violet-500 w-28"/><span className="text-xs font-bold">{fDist} km</span></div>
      <div className="flex items-center gap-2"><I n="flame" s={14} c="text-slate-400"/><span className="eyebrow">URGENCY</span>
        <select className="field !w-auto !py-1.5 text-xs" value={fUrg} onChange={e=>setFUrg(e.target.value)}><option value="any">Any</option><option value="critical">Critical</option><option value="urgent">Urgent</option><option value="normal">Normal</option></select></div>
      <div className="flex items-center gap-2"><I n="wrench" s={14} c="text-slate-400"/><span className="eyebrow">SKILL</span>
        <select className="field !w-auto !py-1.5 text-xs" value={fCat} onChange={e=>setFCat(e.target.value)}><option>All</option>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
      <span className="ml-auto chip bg-slate-100 text-slate-500">{opps.length} opportunities</span>
    </div>

    <div className="grid lg:grid-cols-3 gap-5">

            <p className="text-[11px] text-slate-500 mt-1 flex items-center gap-1"><I n="timer" s={11}/>Est. {c.severity==='critical'?'15–30':c.severity==='urgent'?'30–60':'1–2 h'} min {(c.responders||[]).length>0 && `· ${c.responders.length} joined`}</p>
            <div className="flex gap-2 mt-4">
              <button className={`flex-1 py-2.5 text-xs rounded-[12px] font-bold ${c.severity==='critical'?'btn-g':'btn-p'}`} onClick={()=>acceptCase(c.id)}>{c.severity==='critical'?'I CAN HELP':'JOIN'}</button>

        <div className="grid grid-cols-2 gap-2.5">
          {[['badge-check',profile.actions,'Completed Actions','#10b981'],['heart-handshake',profile.helped,'People Helped','#ef4444'],['clock',profile.hours+' h','Hours Contributed','#3b82f6'],['building',4,'Organizations Supported','#8b5cf6']].map(([ic,v,l,c])=>(
            <div key={l} className="rounded-2xl bg-slate-50 p-3 text-center"><I n={ic} s={15} c="mx-auto" st={{color:c}}/><p className="h1 text-lg mt-1">{v}</p><p className="eyebrow mt-0.5">{l.toUpperCase()}</p></div>))}
        </div>
        <div className="mt-4">
          <div className="flex justify-between text-[11px] font-bold mb-1.5"><span className="eyebrow">RELIABILITY SCORE</span><span className="text-ok">{profile.reliability}%</span></div>
          <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full rounded-full transition-all duration-1000" style={{width:profile.reliability+'%',background:'linear-gradient(90deg,#10b981,#0ea5e9)'}}/></div>
        </div>
        <div className="mt-4">
          <p className="eyebrow mb-2">SKILLS</p>
          <div className="flex flex-wrap gap-1.5">{['First Aid','Logistics','Elderly Care','Driving'].map(s=><span key={s} className="chip bg-vol/10 text-vol">{s}</span>)}</div>
        </div>
        <div className="mt-4">
          <p className="eyebrow mb-2">IMPACT BADGES</p>
          <div className="flex flex-wrap gap-1.5">{profile.badges.map(b=><BadgePill key={b} name={b}/>)}</div>
          <p className="text-[10px] text-slate-400 mt-2">Badges celebrate contribution — never competition.</p>

        <button className="btn-o w-full mt-4 py-2.5 text-xs" onClick={()=>go('profile')}>View Full Profile</button>
      </div>
    </div>

};

/* ============================== CORA AI ASSISTANT ============================== */
const Cora = ({open, setOpen, cases, vols, go, openCase}) => {
  const [msgs,setMsgs] = useState([{role:'ai', text:"Hi. I'm CORA.\nLet's find a way to help. I read the live community state and connect you to where humans are needed most."}]);
  const [input,setInput] = useState('');
  const [typing,setTyping] = useState(false);
  const boxRef = useRef();
  useEffect(()=>{ if(boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; },[msgs,typing,open]);

  const reply = (q) => {
    const s = q.toLowerCase();
    const crit = cases.filter(c=>c.severity==='critical'&&c.status!=='resolved');
    const open = cases.filter(c=>['open','matching'].includes(c.status));
    if(/urgent|critical|emergency/.test(s)) return {text:`There are ${crit.length} critical cases right now. Most urgent: "${crit[0]?.title}" — ${crit[0]?.loc}, about ${crit[0]?km(crit[0]):'-'} km away.`, caseId:crit[0]?.id, action:'Open critical case'};
    if(/30 min|help today|how can i help|volunteer/.test(s)) return {text:`For ~30 minutes of help, your best fit is "${open[0]?.title}" — ${km(open[0])} km away, matching your First Aid skill. ${open.length} open needs total.`, go:'volunteer', action:'Open Volunteer Center'};
    if(/medical|blood/.test(s)) { const m=cases.find(c=>c.category==='Blood'&&c.status!=='resolved')||cases.find(c=>c.category==='Medical'&&c.status!=='resolved'); return {text:`Medical opportunities near you: "${m?.title}" at ${m?.loc}. Dr. Aditi Rao (0.4 km, ★4.9) is also active there.`, caseId:m?.id, action:'Open case'}; }
    if(/near me|nearby|area/.test(s)) return {text:`Within 3 km of you: ${open.length} open needs (${crit.length} critical), ${vols.filter(v=>v.available).length} available volunteers, and 3 partner organizations. The map shows everything live.`, go:'explore', action:'Open map'};
    if(/why.*(urgent|high priority)|explain/.test(s)) return {text:`Cases are marked high priority when I detect time-sensitive factors: risk to people, worsening conditions, weather exposure, or vulnerable individuals. A human always reviews before sensitive actions — I never auto-resolve serious incidents.`};
    if(/volunteers needed most|shortage/.test(s)) return {text:`Volunteer shortage detected in Camp south zone — only 2 active volunteers against 6 open needs. Deccan has strong coverage. If you can travel, Camp is where you'd matter most today.`, go:'heatmap', action:'Open heatmap'};
    if(/unresolved|open/.test(s)) return {text:`${open.length} cases are unresolved in your area, including ${crit.length} critical. Top priority: "${crit[0]?.title||open[0]?.title}".`, caseId:(crit[0]||open[0])?.id, action:'Open case'};
    if(/insight|pattern/.test(s)) return {text:`My strongest insight right now: 12 reports over 72 hours reveal recurring drainage flooding on DP Road, potentially affecting ~1,200 people. Recommended: infrastructure inspection.`, go:'insight', action:'Open CIVORA Insight'};
    return {text:`I can surface nearby needs, explain case priorities, match your skills, or reveal community patterns. Try "How can I help for 30 minutes?" or "Where are volunteers needed most?"`};
  };

  const send = (q) => {
    const text = q||input.trim(); if(!text) return;
    setMsgs(m=>[...m,{role:'user',text}]); setInput(''); setTyping(true);
    setTimeout(()=>{ setTyping(false); setMsgs(m=>[...m,{role:'ai', ...reply(text)}]); }, 900+Math.random()*600);
  };
  const SUGGEST = ['What needs help nearby?','How can I help for 30 minutes?','Show urgent cases.','Why is this case high priority?','Where are volunteers needed most?'];
  if(!open) return null;
  return (
    <div className="fixed bottom-24 right-5 z-[75] w-[380px] max-w-[calc(100vw-32px)] card cora-glow overflow-hidden slide-in flex flex-col" style={{height:520}}>
      <div className="p-4 flex items-center gap-3 text-white" style={{background:'linear-gradient(135deg,#a855f7,#6366f1)'}}>
        <span className="w-10 h-10 rounded-2xl bg-white/20 flex items-center justify-center"><I n="bot" s={19}/></span>
        <div className="flex-1"><p className="h1">CORA</p><p className="text-[10px] text-white/70">Contextual AI companion · humans do the helping</p></div>
        <span className="chip bg-white/20 text-white text-[9px]">ONLINE</span>
        <button onClick={()=>setOpen(false)} className="text-white/80 hover:text-white"><I n="x" s={16}/></button>
      </div>
      <div ref={boxRef} className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/60">
        {msgs.map((m,i)=>(
          <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}>
            <div className={`max-w-[85%] rounded-2xl px-3.5 py-2.5 text-[12.5px] leading-relaxed whitespace-pre-line ${m.role==='user'?'bg-ink text-white rounded-br-md':'bg-white border border-slate-100 shadow-sm rounded-bl-md'}`}>
              {m.text}
              {(m.caseId || m.go) && <button className="mt-2 chip bg-ai/10 text-ai flex items-center gap-1 hover:bg-ai hover:text-white"
                onClick={()=>{ if(m.caseId){openCase(m.caseId); setOpen(false);} else if(m.go){go(m.go); setOpen(false);} }}>
                {m.action||'Open'} <I n="arrow-right" s={11}/></button>}
            </div>
          </div>))}
        {typing && <div className="flex"><div className="bg-white border border-slate-100 shadow-sm rounded-2xl rounded-bl-md px-4 py-3 flex gap-1.5">
          {[0,1,2].map(i=><span key={i} className="w-1.5 h-1.5 rounded-full bg-ai animate-bounce" style={{animationDelay:(i*0.15)+'s'}}/>)}</div></div>}
      </div>
      <div className="p-3 border-t border-slate-100 bg-white">
        <div className="flex gap-1.5 overflow-x-auto pb-2">{SUGGEST.map(s=>(<button key={s} className="chip bg-slate-100 text-slate-500 hover:bg-ai/10 hover:text-ai whitespace-nowrap" onClick={()=>send(s)}>{s}</button>))}</div>
        <div className="flex gap-2">
          <input className="field !py-2.5 text-xs" placeholder="Ask CORA anything…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/>
          <button className="w-10 h-10 rounded-xl flex items-center justify-center text-white shrink-0 hover:scale-105" style={{background:'linear-gradient(135deg,#a855f7,#6366f1)'}} onClick={()=>send()}><I n="send" s={15}/></button>
        </div>
      </div>
    </div>);
};

  const [successCase,setSuccessCase] = useState(null);
  const [demo,setDemo] = useState(null); // {step, scene, paused, total, caseId}
  const [profile,setProfile] = useState({helped:23, actions:11, volunteerActions:14, hours:8.5, reliability:96, badges:['Community Helper','First Responder']});
  const caseSeq = useRef(2101);
  const demoTimers = useRef([]);

  const toast = useCallback((title, body, color='#10b981', icon='check')=>{
    const id = uid(); setToasts(t=>[...t,{id,title,body,color,icon}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 4600);
  },[]);
  const pushNotif = useCallback((n)=> setNotifs(list=>[{id:uid(), unread:true, time:'just now', ...n}, ...list]),[]);
  const patchCase = useCallback((id, fn)=> setCases(cs=>cs.map(c=>c.id===id?fn({...c}):c)),[]);

  const go = useCallback((v)=>{ setView(v); setSelectedCaseId(null); window.scrollTo({top:0}); },[]);
  const openCase = useCallback((id)=>{ setSelectedCaseId(id); setView('explore'); setEmergency(false); window.scrollTo({top:0}); },[]);
  const enter = useCallback((r,v)=>{ setStarted(true); setRole(r); setView(v); },[]);
  const setRoleNav = useCallback((r)=>{ setRole(r); go(ROLE_HOME[r]); },[go]);

  const stats = useMemo(()=>({
    helped: 12483 + cases.filter(c=>c.demo&&c.status==='resolved').length,
    volunteers: 3842, resolved: 1927 + cases.filter(c=>c.demo&&c.status==='resolved').length, response: 18
  }),[cases]);

  const createCase = useCallback(({desc, files, loc, approx, anon, cat, sev, ai})=>{
    const id = 'CV-'+(caseSeq.current++);
    const title = desc ? (desc.length>64? desc.slice(0,64).trim()+'…' : desc) : (ai.det+' — reported incident');
    const c = { id, title, category:cat, severity:sev, status:'matching', trust:ai.trust, trustState:ai.trustState,
      x: loc?loc.x:50, y: loc?loc.y:50, loc: approx?'Approx. · Deccan, Pune':'Pinned location · Deccan, Pune',
      time: nowT(), reporter: anon?'Anonymous':'You', desc: desc||ai.det, files: files||[], responders:[], org:null, peopleHelped:1, demo:true,
      timeline:[TL(nowT(), anon?'Reported anonymously (privacy protected)':'Reported by you'),
        TL(nowT(), `AI classified: ${cat} — severity ${SEV[sev].label}`, 'sparkles'),
        TL(nowT(), `Trust Score ${ai.trust}% — ${TRUST_META[ai.trustState].label}`, 'shield-check'),
        TL(nowT(), 'CIVORA MATCH searching for responders…', 'git-merge')]};
    setCases(cs=>[c,...cs]);
    pushNotif({icon:'📢', title:'Your report is live', body:`Case ${id} created and matched with nearby responders.`, caseId:id});
    return c;
  },[pushNotif]);

  const matchNotify = useCallback((id)=>{
    patchCase(id, c=>{ if(c.status==='open') c.status='matching';
      c.timeline=[...c.timeline, TL(nowT(),'Best-matched volunteers & organizations notified','send')]; return c; });
    toast('🤖 CIVORA MATCH','Matched responders notified — waiting for a human to accept.','#a855f7','send');
    pushNotif({icon:'🧠', title:'CIVORA MATCH complete', body:'Top-ranked volunteers and organizations were notified.', caseId:id});
    setTimeout(()=>{
      patchCase(id, c=>{ if(['open','matching'].includes(c.status)){
        c.status='in_progress';
        c.responders=[{n:'Vikram Nair',r:'Search & Rescue · 0.6 km'}, ...(c.responders||[])];
        c.timeline=[...c.timeline, TL(nowT(),'Volunteer Vikram Nair accepted the case','user-check'), TL(nowT(),'Assistance in progress','activity')]; }
        return c; });
      toast('🤝 Volunteer accepted','Vikram Nair (0.6 km · 96% reliability) is on the way.','#10b981','user-check');
      pushNotif({icon:'🟢', title:'Volunteer accepted the case', body:'Vikram Nair is responding — case moved to In Progress.', caseId:id});
    }, 4000);
  },[patchCase, toast, pushNotif]);

  const acceptCase = useCallback((id)=>{
    patchCase(id, c=>{ c.status='in_progress';
      c.responders=[{n:'You',r:'Volunteer · now'}, ...(c.responders||[])];
      c.timeline=[...c.timeline, TL(nowT(),'You accepted the case','user-check'), TL(nowT(),'Assistance in progress','activity')]; return c; });
    toast('💚 You are on it','Case accepted. Coordinate safely — mark complete when done.','#10b981','hand-helping');
    openCase(id);
  },[patchCase, toast, openCase]);

  const markComplete = useCallback((id)=>{
    patchCase(id, c=>{ c.status='awaiting_confirmation';
      c.timeline=[...c.timeline, TL(nowT(),'Action marked complete — awaiting human confirmation','flag')]; return c; });
    toast('⏳ Awaiting confirmation','Sensitive cases need the reporter to confirm resolution.','#0ea5e9','shield-check');
  },[patchCase, toast]);

  const confirmResolution = useCallback((id)=>{
    patchCase(id, c=>{ c.status='resolved'; c.resolvedAt=nowT();
      c.timeline=[...c.timeline, TL(nowT(),'Resolved — confirmed by reporter','badge-check')]; return c; });
    setProfile(p=>{
      const badges = [...p.badges];
      if(p.helped+1>=10 && !badges.includes('Community Helper')) badges.push('Community Helper');
      if(p.helped+1>=100 && !badges.includes('100 Lives Touched')) badges.push('100 Lives Touched');
      return {...p, helped:p.helped+1, actions:p.actions+1, volunteerActions:p.volunteerActions+1, hours:+(p.hours+0.5).toFixed(1), badges};
    });
    pushNotif({icon:'✅', title:'Case verified as resolved', body:`${id} confirmed by the community. Impact recorded.`, caseId:id});
    setSuccessCase(id);
  },[patchCase, pushNotif]);

  /* ---------- DEMO SCRIPT ---------- */
  const DEMO_STEPS = [
    ['intro','explore', 4200], ['report','report', 5200], ['ai','report', 6200], ['trust','report', 5200],
    ['insight','insight', 5600], ['case','explore', 4600], ['match','explore', 5600], ['accept','case', 4600],
    ['room','case', 5200], ['progress','case', 4600], ['complete','case', 4600], ['resolved','case', 4600],
    ['impact','impact', 5600], ['finale','finale', 6400]
  ];
  const demoCaseId = useRef(null);
  const clearDemoTimers = ()=>{ demoTimers.current.forEach(clearTimeout); demoTimers.current=[]; };
  const stopDemo = useCallback(()=>{ clearDemoTimers(); setDemo(null); },[]);

  const startDemo = useCallback(()=>{
    clearDemoTimers();
    setStarted(true); setRole('citizen'); setPresent(false); setEmergency(false); setCoraOpen(false); setSelectedCaseId(null);
    // create the flooded-road case up front, hidden state evolves across scenes
    const id = 'CV-'+(caseSeq.current++);
    demoCaseId.current = id;
    const c = { id, title:'Dangerous flooded road near Deccan Gymkhana', category:'Infrastructure', severity:'urgent', status:'matching',
      trust:91, trustState:'verified', x:47, y:44, loc:'DP Road, Deccan · Pune', time:nowT(), reporter:'A citizen (photo report)',
      desc:'Heavy monsoon rain has waterlogged DP Road near Deccan Gymkhana. A scooter skidded minutes ago. The storm drain appears completely blocked — water is rising fast.',
      files:[{name:'flooded-road.jpg',type:'image'}], responders:[], org:null, peopleHelped:120, demo:true,
      timeline:[TL(nowT(),'Citizen report received with photo evidence','camera')]};
    setCases(cs=>[c,...cs]);
    setDemo({step:0, scene:'intro', paused:false, total:DEMO_STEPS.length, caseId:id});

    let t = 0;
    DEMO_STEPS.forEach(([scene, target, dur], i)=>{
      t += 0; // step starts when previous ends
      demoTimers.current.push(setTimeout(()=>{
        setDemo(d=> d && !d.paused ? {...d, step:i, scene} : d);
        if(target==='report') go('report');
        if(target==='insight') go('insight');
        if(target==='explore') go('explore');
        if(target==='impact') go('impact');
        if(target==='case') openCase(id);
        if(target==='finale'){ setSelectedCaseId(null); setView('finale'); }
        // case evolution
        if(scene==='ai') patchCase(id, cc=>{ cc.timeline=[...cc.timeline, TL(nowT(),'AI analyzed image: severe waterlogging — blocked drainage','sparkles')]; return cc; });
        if(scene==='trust') patchCase(id, cc=>{ cc.timeline=[...cc.timeline, TL(nowT(),'Trust Score 91% — VERIFIED','shield-check')]; return cc; });
        if(scene==='insight') patchCase(id, cc=>{ cc.timeline=[...cc.timeline, TL(nowT(),'CIVORA Insight linked 3 earlier flooding reports','brain')]; return cc; });
        if(scene==='match'){ patchCase(id, cc=>{ cc.timeline=[...cc.timeline, TL(nowT(),'CIVORA MATCH: Vikram Nair — 96% match (0.6 km · Search & Rescue)','git-merge')]; return cc; });
          pushNotif({icon:'🧠', title:'CIVORA MATCH complete', body:'Vikram Nair is the best match for '+id+'.', caseId:id}); }
        if(scene==='accept') patchCase(id, cc=>{ cc.status='in_progress';
          cc.responders=[{n:'Vikram Nair',r:'Search & Rescue · 0.6 km'},{n:'CleanCity Crew',r:'Drain-clearing team'}];
          cc.timeline=[...cc.timeline, TL(nowT(),'Vikram Nair accepted — Response Room opened','user-check')]; return cc; });
        if(scene==='progress') patchCase(id, cc=>{ cc.timeline=[...cc.timeline, TL(nowT(),'Team on site — warning commuters, clearing drain','activity')]; return cc; });
        if(scene==='complete') patchCase(id, cc=>{ cc.status='awaiting_confirmation'; cc.timeline=[...cc.timeline, TL(nowT(),'Action marked complete — awaiting human confirmation','flag')]; return cc; });
        if(scene==='resolved'){ patchCase(id, cc=>{ cc.status='resolved'; cc.resolvedAt=nowT(); cc.timeline=[...cc.timeline, TL(nowT(),'Resolved — confirmed by the reporting citizen','badge-check')]; return cc; });
          pushNotif({icon:'✅', title:'Case verified as resolved', body:id+' — DP Road is safe again. Impact recorded.', caseId:id});
          setProfile(p=>({...p, helped:p.helped+1, actions:p.actions+1})); }
      }, DEMO_STEPS.slice(0,i).reduce((a,s)=>a+s[2],0) ));
    });
    demoTimers.current.push(setTimeout(()=>{ setDemo(null); }, DEMO_STEPS.reduce((a,s)=>a+s[2],0)+1000));
  },[go, openCase, patchCase, pushNotif]);

  const demoPause = ()=>{ clearDemoTimers(); setDemo(d=>({...d, paused:true})); };
  const demoResume = ()=>{
    if(!demo) return;
    // resume from current step with remaining scenes
    const idx = demo.step;
    const id = demo.caseId;
    let acc = 0;
    DEMO_STEPS.slice(idx+1).forEach(([scene, target, dur], j)=>{
      const i = idx+1+j;
      demoTimers.current.push(setTimeout(()=>{
        setDemo(d=> d? {...d, step:i, scene, paused:false} : d);
        if(target==='insight') go('insight'); else if(target==='impact') go('impact');
        else if(target==='explore') go('explore'); else if(target==='report') go('report');
        else if(target==='case') openCase(id); else if(target==='finale'){ setSelectedCaseId(null); setView('finale'); }
        if(scene==='match'){ patchCase(id, cc=>{ cc.timeline=[...cc.timeline, TL(nowT(),'CIVORA MATCH: Vikram Nair — 96% match','git-merge')]; return cc; }); }
        if(scene==='accept') patchCase(id, cc=>{ cc.status='in_progress'; cc.responders=[{n:'Vikram Nair',r:'Search & Rescue · 0.6 km'},{n:'CleanCity Crew',r:'Drain-clearing team'}]; cc.timeline=[...cc.timeline, TL(nowT(),'Vikram Nair accepted — Response Room opened','user-check')]; return cc; });
        if(scene==='progress') patchCase(id, cc=>{ cc.timeline=[...cc.timeline, TL(nowT(),'Team on site — clearing drain','activity')]; return cc; });
        if(scene==='complete') patchCase(id, cc=>{ cc.status='awaiting_confirmation'; cc.timeline=[...cc.timeline, TL(nowT(),'Action marked complete — awaiting human confirmation','flag')]; return cc; });
        if(scene==='resolved'){ patchCase(id, cc=>{ cc.status='resolved'; cc.resolvedAt=nowT(); cc.timeline=[...cc.timeline, TL(nowT(),'Resolved — confirmed by the reporting citizen','badge-check')]; return cc; }); setProfile(p=>({...p, helped:p.helped+1, actions:p.actions+1})); }
      }, acc)); acc += dur;
    });
    demoTimers.current.push(setTimeout(()=>setDemo(null), acc+800));
    setDemo(d=>({...d, paused:false}));
  };
  const demoSkip = ()=>{ stopDemo(); setStarted(true); go('explore'); };

  const unread = notifs.filter(n=>n.unread).length;
  const selectedCase = cases.find(c=>c.id===selectedCaseId);

  if(!started) return <Landing enter={enter} stats={stats} startDemo={startDemo}/>;

  return (
  <div className={`min-h-screen ${present?'presenting':''}`}>
    {!present && <TopNav view={view} go={go} role={role} setRole={setRoleNav} unread={unread}
      notifOpen={notifOpen} setNotifOpen={setNotifOpen} notifs={notifs}
      markAllRead={()=>setNotifs(ns=>ns.map(n=>({...n,unread:false})))}
      openCase={openCase} setCoraOpen={setCoraOpen} enterEmergency={()=>setEmergency(true)}
      startDemo={startDemo} present={present} setPresent={setPresent}/>}

    <main className={`max-w-[1500px] mx-auto px-4 py-6 ${present?'pt-10':''}`} onClick={()=>notifOpen&&setNotifOpen(false)}>
      {selectedCase && view!=='finale' ? (
        <CasePage c={selectedCase} vols={vols} orgs={orgs} back={()=>setSelectedCaseId(null)}
          acceptCase={acceptCase} markComplete={markComplete} confirmResolution={confirmResolution} matchNotify={matchNotify}/>
      ) : view==='finale' ? (
        <div className="min-h-[70vh] flex items-center justify-center">
          <div className="text-center max-w-2xl mx-auto px-4">
            {['ONE REPORT','BECAME','ONE COMMUNITY ACTION','THAT HELPED','MANY PEOPLE'].map((l,i)=>(
              <p key={l} className={`rise ${i%2===0?'h1 text-4xl md:text-5xl':'h2 text-lg text-slate-400 my-2 tracking-[.2em]'}`} style={{animationDelay:(i*0.5)+'s', color:i%2===0?undefined:undefined}}>{l}</p>))}
            <div className="flex items-center justify-center gap-3 mt-10 rise" style={{animationDelay:'2.8s'}}>
              <Logo s={44}/>
              <div className="text-left"><p className="h1 text-2xl">CIVORA</p><p className="text-[10px] font-bold tracking-[.2em] text-slate-400">PEOPLE. INTELLIGENCE. ACTION.</p></div>
            </div>
            <button className="btn-p px-8 py-3.5 text-sm mt-8 rise" style={{animationDelay:'3.2s'}} onClick={()=>go('explore')}>Back to the Community →</button>
          </div>
        </div>
      ) : view==='explore' ? (
        <Explore cases={cases} vols={vols} orgs={orgs} openCase={openCase} go={go} stats={stats} enterEmergency={()=>setEmergency(true)} role={role} acceptCase={acceptCase}/>
      ) : view==='report' ? (
        demo && ['ai','trust'].includes(demo.scene) ? (
          <div className="max-w-3xl mx-auto fade-in">
            <DemoAIScene scene={demo.scene}/>
          </div>
        ) : demo && demo.scene==='report' ? (
          <div className="max-w-3xl mx-auto fade-in"><DemoReportScene/></div>
        ) : (
        <ReportFlow createCase={createCase} matchNotify={matchNotify} openCase={openCase} vols={vols} orgs={orgs}/>)
      ) : view==='volunteer' ? (
        <VolunteerCenter cases={cases} vols={vols} acceptCase={acceptCase} openCase={openCase} profile={profile} go={go}/>
      ) : view==='orgs' ? (
        <OrgCenter cases={cases} vols={vols} orgs={orgs} resources={resources} openCase={openCase} acceptCase={acceptCase} toast={toast}/>
      ) : view==='insight' ? (
        <InsightPage openCase={openCase} cases={cases}/>
      ) : view==='heatmap' ? (
        <HeatmapPage cases={cases} vols={vols} orgs={orgs} openCase={openCase}/>
      ) : view==='impact' ? (
        <ImpactPage stats={stats} profile={profile} cases={cases}/>
      ) : view==='profile' ? (
        <ProfilePage profile={profile}/>
      ) : null}

      {view==='explore' && !selectedCase && (
        <div className="mt-5 flex flex-wrap gap-3">
          <button className="btn-o px-5 py-3 text-xs flex items-center gap-2" onClick={()=>go('heatmap')}><I n="flame" s={14}/>Open Impact Heatmap</button>
          <button className="btn-o px-5 py-3 text-xs flex items-center gap-2" onClick={()=>go('insight')}><I n="brain" s={14}/>View CIVORA Insights</button>
        </div>)}
    </main>

    {!coraOpen && !present && <button onClick={()=>setCoraOpen(true)}
      className="fixed bottom-20 lg:bottom-5 right-5 z-[74] flex items-center gap-2 px-5 py-3.5 rounded-full text-white font-bold text-sm shadow-2xl hover:scale-105"
      style={{background:'linear-gradient(135deg,#a855f7,#6366f1)'}}>
      <I n="sparkles" s={16}/>Ask CORA</button>}
    <Cora open={coraOpen} setOpen={setCoraOpen} cases={cases} vols={vols} go={go} openCase={openCase}/>

    {emergency && <EmergencyMode cases={cases} vols={vols} orgs={orgs} resources={resources}
      acceptCase={(id)=>{setEmergency(false); acceptCase(id);}} exit={()=>setEmergency(false)} openCase={(id)=>{setEmergency(false); openCase(id);}}/>}
    {successCase && <SuccessOverlay caseId={successCase} teamSize={3} elapsed="9 min" onDone={()=>{setSuccessCase(null); go('impact');}}/>}
    {demo && <DemoMode demo={demo} onPause={demoPause} onResume={demoResume} onSkip={demoSkip} onExit={demoSkip}/>}
    {present && <PresentMode cases={cases} stats={stats} vols={vols} openCase={openCase} exit={()=>setPresent(false)}/>}
    {!present && <MobileNav view={view} go={go} setCoraOpen={setCoraOpen}/>}
    <Toasts toasts={toasts}/>
  </div>);
}

/* Demo cinematic sub-scenes */
const DemoReportScene = () => (
  <div className="card p-8 text-center">
    <p className="eyebrow mb-2">CITIZEN REPORT</p>
    <h2 className="h1 text-2xl">"Dangerous flooded road near Deccan Gymkhana"</h2>
    <div className="mx-auto mt-5 w-40 h-40 rounded-3xl flex flex-col items-center justify-center text-white shadow-xl" style={{background:'linear-gradient(135deg,#334155,#0f1b2d)'}}>
      <I n="image" s={34}/><span className="text-[10px] font-bold mt-2">flooded-road.jpg</span>
    </div>
    <p className="text-xs text-slate-500 mt-4">One photo. Ten seconds. That's all it took.</p>
    <div className="flex justify-center gap-2 mt-4">{['Report received','Location pinned','Evidence attached'].map((s,i)=>(
      <span key={s} className="chip bg-ok/10 text-ok rise" style={{animationDelay:(i*0.6)+'s'}}>✓ {s}</span>))}</div>
  </div>);
const DemoAIScene = ({scene}) => (
  <div className="card p-8">
    <div className="flex items-center gap-3 mb-6">
      <span className="relative w-12 h-12 flex items-center justify-center">
        <span className="absolute inset-0 rounded-2xl spin-slow" style={{background:'conic-gradient(#a855f7,#6366f1,#10b981,#a855f7)', WebkitMask:'radial-gradient(circle, transparent 56%, black 58%)', mask:'radial-gradient(circle, transparent 56%, black 58%)'}}/>
        <span className="w-8 h-8 rounded-xl flex items-center justify-center text-white" style={{background:'linear-gradient(135deg,#a855f7,#6366f1)'}}><I n="brain" s={15}/></span>
      </span>
      <div><h2 className="h1 text-xl">CORA is analyzing</h2><p className="text-xs text-slate-500">Image understanding · signal cross-check · trust scoring</p></div>
    </div>
    <div className="space-y-2">
      {['Input analyzed — photo of waterlogged road','Category detected: Infrastructure','Severity estimated: URGENT','2 related reports found within 72 h','Trust Score computed: 91% — VERIFIED'].map((s,i)=>(
        <div key={s} className="flex items-center gap-3 p-3 rounded-xl bg-slate-50 rise" style={{animationDelay:(i*0.5)+'s'}}>
          <span className="w-6 h-6 rounded-full bg-ok text-white flex items-center justify-center shrink-0"><I n="check" s={12}/></span>
          <p className="text-xs font-semibold">{s}</p>
        </div>))}
    </div>
  </div>);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>

</body>
